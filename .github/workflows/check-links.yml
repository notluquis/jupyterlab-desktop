# Link rot in the documentation, found before a reader finds it.
# Uses the organisation's own action, the same one jupyterlab/jupyterlab runs.
name: External Link Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly. Link rot happens over time rather than per commit, so a pull
    # request trigger alone would never see a link that died after it merged.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  should_audit:
    name: Check for external link changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_audit: ${{ steps.decide.outputs.run_audit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request that changed no line containing a URL has nothing to
      # audit. Filtering on paths would miss a link added to a .ts or a .yml,
      # and would still run on a markdown change that touched no link.
      - id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet --no-ext-diff --diff-filter=ACMRT -G'https?://' "$BASE_SHA" "$HEAD_SHA"; then
            echo "run_audit=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ "$status" == "1" ]] || exit "$status"
            echo "run_audit=true" >> "$GITHUB_OUTPUT"
          fi

  audit:
    name: Audit external links
    needs: should_audit
    if: needs.should_audit.outputs.run_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@95d85449e4f3f352e261221f6529f8ed307f5728 # v1
        with:
          # blog.jupyter.org is on Medium, which answers the checker with 403
          # while the pages themselves load. It is on jupyterlab's own ignore
          # list for the same reason.
          ignore_links: 'https://blog.jupyter.org/.*'
