# Link rot in the documentation, found before a reader finds it.
# Uses the organisation's own action, the same one jupyterlab/jupyterlab runs.
name: External Link Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly. Link rot happens over time rather than per commit, so a pull
    # request trigger alone would never see a link that died after it merged.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only a superseded pull request run is worth cancelling. Keyed on the ref
  # alone, a push to master would cancel the weekly run, and a cancelled run is
  # grey rather than red, so the skipped week would pass unnoticed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# jupyterlab/jupyterlab puts a job in front of this one that skips the audit
# when no changed line contains a URL. That is worth a second runner there,
# where the audit builds the docs first and takes minutes. Here it is 25
# seconds, and the gate would cost more than it saves: measured over the seven
# audited files, 65 of the anchors are relative or local against 8 external
# ones, and a broken relative link changes no line containing a URL — so the
# gate would skip exactly the majority case and let it surface on master.
jobs:
  audit:
    name: Audit external links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@95d85449e4f3f352e261221f6529f8ed307f5728 # v1
        with:
          # Same stance as jupyterlab's own list, narrowed to the hosts this
          # repository actually links. Entries for hosts nothing here links
          # would be config nobody can evaluate.
          #
          #   github.com       the checker validates a link with a full GET, no
          #                    HEAD and no streaming, so the five installer links
          #                    in the README download 2.2 GB per run and cache
          #                    it. Ignoring the host also keeps 18 unauthenticated
          #                    fetches away from the anonymous rate limit, which
          #                    matters because this check blocks.
          #   blog.jupyter.org on Medium, which answers a checker with 403 while
          #                    the pages themselves load. Measured on a run
          #                    without it: all six came back 403.
          #
          # Counted on master as the checker sees them, rendered anchors rather
          # than text: 8 external links across 5 hosts stay audited —
          # snapcraft.io, docs.conda.io, conda.github.io, readthedocs and
          # support.microsoft.com — plus the 65 relative ones. docs.conda.io is
          # on jupyterlab's ignore list and not on this one, because both of its
          # links answered 200 when measured; if it turns flaky it belongs here.
          #
          # Known gap: check_links.py globs `**/*.md`, and Python's glob skips
          # dot-directories, so nothing under .github is audited — the pull
          # request and issue templates included.
          ignore_links: >-
            https://github.com/.*
            https://blog.jupyter.org/.*
