# Link rot in the documentation, found before a reader finds it. Uses the organisation's own action, the same one jupyterlab/jupyterlab runs.
name: External Link Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly: link rot happens over time, so a pull request trigger alone would never see a link that died after it merged.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # event_name is in the group above, so push, schedule and pull_request never share a group and cannot cancel each other. This narrows it further, to the only case where cancelling is right: a superseded run of the same pull request. A cancelled run is grey rather than red, so cancelling anything else would hide a result instead of replacing it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No change-detection job, unlike jupyterlab's: theirs builds the docs first, this audit is 25 seconds, and gating on `https?://` would skip broken relative links, which are most of them here. See the pull request for the counts.
# Not audited: markdown under `.github/`. check_links.py collects with `glob.glob('**/*.md', recursive=True)`, and that function skips dot-directories unless asked otherwise, so the pull request and issue templates are outside this permanently. Measured, not assumed: `pathlib.Path.glob` does see them, so reading the wrong one of the two is how this looks covered.
jobs:
  audit:
    name: Audit external links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Advisory on a pull request, blocking on master and on the weekly run. The hosts here belong to other people: one 403 from Cloudflare or a Read the Docs outage would otherwise turn every pull request in the repo red, including a TypeScript change that touches no documentation, and the fix would be editing this file under pressure. On master and on the schedule there is nothing to hold up, so there it stays a hard gate and link rot still surfaces.
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@95d85449e4f3f352e261221f6529f8ed307f5728 # v1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          # github.com: the checker GETs each link in full, so the README's installer links download 2.2 GB per run. blog.jupyter.org: Medium answers a checker with 403 while the pages load. Both are on jupyterlab's list for the same reasons.
          ignore_links: >-
            https://github.com/.*
            https://blog.jupyter.org/.*
