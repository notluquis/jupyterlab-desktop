# Link rot in the documentation, found on a schedule rather than by a reader.
# https://github.com/lycheeverse/lychee-action
name: Documentation links

on:
  pull_request:
    branches: [master]
    paths: ['**/*.md']
  schedule:
    # Weekly. Link rot happens over time, not per commit, so a pull request
    # trigger alone would never catch a link that died after it merged.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # for the token below
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Report only, the same stance zizmor.yml took when it landed. A link
          # checker that fails the build on someone else's outage blocks a pull
          # request that changed nothing, so the result goes to the job summary
          # and a real break is acted on from there. The baseline is already clean,
          # so making this a hard gate is a one-line change whenever that trade
          # looks right. Report-only also hides a misconfigured run: a bad argument
          # makes lychee print its usage and the job still passes, which is why the
          # arguments below were verified against a real run rather than read.
          fail: false
          jobSummary: true
          # The token lifts GitHub's anonymous rate limit; most links here point
          # at this repository and its releases.
          token: ${{ secrets.GITHUB_TOKEN }}
          # blog.jupyter.org is on Medium, which serves 403 to the checker while the
          # pages themselves are alive. Measured on a run without that exclusion: all
          # six came back 403 and nothing else did. A comment cannot go inside the
          # folded block below, it would be passed to lychee as an argument.
          args: >-
            --no-progress
            --max-retries 2
            --exclude ^https://blog\.jupyter\.org
            --
            '**/*.md'
